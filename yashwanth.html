<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Market | Order Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { background-color: #0d1117; color: #e6edf3; font-family: 'Inter', sans-serif; }
        .sidebar { border-right: 1px solid #30363d; height: 100vh; }
        .order-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 1.5rem; }
        .status-badge { background-color: rgba(16, 185, 129, 0.1); color: #10b981; font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="flex">

    <!-- Sidebar Navigation -->
    <aside class="w-64 sidebar p-6 fixed hidden lg:block">
        <h2 class="text-emerald-500 font-bold text-xl mb-12 tracking-tight">NEXUS MARKET</h2>
        <nav class="space-y-6">
            <a href="#" class="flex items-center gap-4 text-gray-400 hover:text-white transition"><i class="fas fa-home"></i> Home</a>
            <a href="#" class="flex items-center gap-4 text-white font-semibold"><i class="fas fa-shopping-bag"></i> My Orders</a>
            <a href="#" class="flex items-center gap-4 text-gray-400 hover:text-white transition"><i class="fas fa-wallet"></i> Wallet</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-64 p-8 min-h-screen">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-bold mb-2">Order Details</h1>
                <p class="text-gray-500 text-sm">Account: <span class="text-gray-300">Yashwanth</span></p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-gray-400">View Profile</span>
                <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center font-bold text-black">Y</div>
            </div>
        </header>

        <div class="max-w-5xl order-card overflow-hidden">
            <div class="md:flex">
                <!-- Product Image -->
                <div class="md:w-1/3 p-8 flex items-center justify-center bg-[#0d1117]/50">
                    <img src="https://images.unsplash.com/photo-1593642702821-c8da6771f0c6?auto=format&fit=crop&q=80&w=1000" alt="Workstation Laptop" class="rounded-lg shadow-2xl opacity-80 hover:opacity-100 transition">
                </div>

                <!-- Product Info -->
                <div class="md:w-2/3 p-10">
                    <span class="status-badge" id="statusLabel">STATUS: DELIVERED</span>
                    <h2 class="text-5xl font-bold mt-4 mb-2 tracking-tighter">Precision Workstation Z4</h2>
                    <p class="text-gray-500 font-mono text-xs mb-8">TX_ID: #YSH-4421-LAP</p>

                    <!-- Professional-looking Return Interface -->
                    <div class="mb-8 p-6 bg-white/5 rounded-2xl border border-white/5">
                        <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-2">Return Eligibility</p>
                        <p class="text-sm text-gray-300">This high-value item is eligible for return within 30 days of delivery. Please ensure all original packaging is intact.</p>
                    </div>

                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] uppercase font-bold text-gray-500 tracking-widest mb-2 block">Return Reason</label>
                            <select class="w-full bg-[#0d1117] border border-[#30363d] rounded-xl p-4 text-sm focus:outline-none focus:border-emerald-500 transition">
                                <option>Incompatible with existing software</option>
                                <option>Better price found elsewhere</option>
                                <option>Performance issues</option>
                                <option>Changed mind</option>
                            </select>
                        </div>

                        <button id="returnBtn" onclick="triggerRingDetection()" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:scale-[1.01] transition-all uppercase tracking-widest text-xs">
                            INITIATE RETURN REQUEST
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Unique Identity for this node
        const MY_NAME = "Yashwanth"; 

        function triggerRingDetection() {
            const activeAsset = "Precision Workstation Z4";
            
            // 1. SILENT DISPATCH (Sent to ReturnGuard.ai Admin)
            const silentFlag = {
                user: MY_NAME, 
                asset: activeAsset,
                type: "Organized Return Ring",
                vector: "IP Correlation: 192.168.X.X (Multi-Account Match)",
                timestamp: new Date().toLocaleString()
            };
            
            localStorage.setItem('FRAUD_SIGNAL', JSON.stringify(silentFlag));

            // 2. NORMAL DECEPTION UI
            const statusLabel = document.getElementById('statusLabel');
            if (statusLabel) {
                statusLabel.innerText = "STATUS: RETURN AUTHORIZING";
                statusLabel.style.backgroundColor = "rgba(59, 130, 246, 0.1)"; // Blue tint
                statusLabel.style.color = "#3b82f6";
            }

            const btn = document.getElementById('returnBtn'); 
            if (btn) {
                btn.innerHTML = "REQUEST PENDING APPROVAL";
                btn.disabled = true;
                btn.style.opacity = "0.6";
                btn.style.cursor = "not-allowed";
            }
        }

        // 3. BLOCKING LISTENER (Triggered by Admin 'Suppress' button)
        setInterval(() => {
            const commandRaw = localStorage.getItem('ADMIN_COMMAND');
            if (commandRaw) {
                const command = JSON.parse(commandRaw);
                
                if (command.target === MY_NAME && command.action === "BLOCK_NODE") {
                    document.body.innerHTML = `
                        <div style="height: 100vh; background: #030406; color: white; display: flex; align-items: center; justify-content: center; font-family: sans-serif; text-align: center;">
                            <div style="padding: 50px; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 30px; background: rgba(239, 68, 68, 0.05); max-width: 450px;">
                                <div style="background: #ef4444; width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                                    <i class="fas fa-network-wired text-2xl text-white"></i>
                                </div>
                                <h1 style="color: #ef4444; font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.05em;">SYSTEM LOCKDOWN</h1>
                                <p style="color: #94a3b8; font-size: 0.875rem; line-height: 1.5;">ReturnGuard.ai has detected a coordinated fraud pattern linked to this IP. All associated marketplace accounts are restricted.</p>
                                <p style="font-size: 10px; color: #475569; margin-top: 30px; text-transform: uppercase; font-weight: bold;">Security Protocol: ORG-RING-IP-BANNED</p>
                            </div>
                        </div>`;
                    document.body.style.overflow = "hidden";
                    localStorage.removeItem('ADMIN_COMMAND'); 
                }
            }
        }, 1000);
    </script>
</body>
</html>
